# The four apps alone, without the MCP servers: docker compose -f docker-compose.apps.yml up -d --build
# docker-compose.yml includes this file and adds the MCP servers, which is what `docker compose up` starts.
#   emucraft      G-code viewer             http://emucraft:8000
#   moonshot      Moonshot's web page       http://moonshot:8000
#   laser         laser engraving simulator http://laser:80
#   laser-api     laser customer GLB API    http://laser-api:8001/api/laser/  (for the shop's backend)
# All on the shared Caddy network, none publishing ports.
services:
  emucraft:
    build: .
    image: emucraft:latest
    container_name: emucraft
    restart: unless-stopped
    expose:
      - "8000"
    # Uncomment to list your own programs (and an emucraft.toml) in the viewer
    # volumes:
    #   - ./programs:/programs:ro
    networks:
      - emucraft

  moonshot:
    build:
      context: .
      dockerfile: moonshot/Dockerfile
    image: moonshot:latest
    container_name: moonshot
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - moonshot-web:/data
    networks:
      - emucraft

  laser:
    build: laser
    image: emucraft-laser:latest
    container_name: laser
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - LASER_TOKEN=${LASER_TOKEN:-}   # nginx passes it to laser-api for the template picker
    networks:
      - emucraft

  # Laser customer GLB API (laser/server.mjs): POST /api/laser/render -> customer GLB. Rendering is CPU- and
  # memory-heavy, so it is capped; set LASER_TOKEN unless only the shop's backend can reach it.
  laser-api:
    build:
      context: laser
      dockerfile: Dockerfile.api
    image: emucraft-laser-api:latest
    container_name: laser-api
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    expose:
      - "8001"
    environment:
      - LASER_TOKEN=${LASER_TOKEN:-}
      - LASER_SECRET=${LASER_SECRET:-}
    volumes:
      - laser-templates:/templates:ro   # renders templates by id; laser-mcp uploads them
    networks:
      - emucraft

volumes:
  moonshot-web:
  laser-templates:   # proprietary template parts: never bind-mount this into a served directory

networks:
  emucraft:
    external: true
    name: ${EMUCRAFT_NETWORK:-emucraft}
