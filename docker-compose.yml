# Three apps, each its own image, all on the shared Caddy network and none publishing ports:
#   emucraft      G-code viewer             http://emucraft:8000
#   moonshot      Moonshot's web page       http://moonshot:8000
#   laser         laser engraving simulator http://laser:80
#   laser-api     laser customer GLB API    http://laser-api:8001/api/laser/  (for the shop's backend)
#   moonshot-mcp  Moonshot's MCP server     http://moonshot-mcp:8000/mcp  (only with --profile moonshot-mcp)
#   emucraft-mcp  emucraft's MCP server     http://emucraft-mcp:8000/mcp  (only with --profile emucraft-mcp)
#   laser-mcp     the laser MCP server      http://laser-mcp:8000/mcp     (only with --profile laser-mcp)
# All three MCP servers: COMPOSE_PROFILES=moonshot-mcp,emucraft-mcp,laser-mcp docker compose up -d
services:
  emucraft:
    build: .
    image: emucraft:latest
    container_name: emucraft
    restart: unless-stopped
    expose:
      - "8000"
    # Uncomment to list your own programs (and an emucraft.toml) in the viewer
    # volumes:
    #   - ./programs:/programs:ro
    networks:
      - emucraft

  moonshot:
    build:
      context: .
      dockerfile: moonshot/Dockerfile
    image: moonshot:latest
    container_name: moonshot
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - moonshot-web:/data
    networks:
      - emucraft

  laser:
    build: laser
    image: emucraft-laser:latest
    container_name: laser
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - emucraft

  # Laser customer GLB API (laser/server.mjs): POST /api/laser/render -> customer GLB. Rendering is CPU- and
  # memory-heavy, so it is capped; set LASER_TOKEN unless only the shop's backend can reach it.
  laser-api:
    build:
      context: laser
      dockerfile: Dockerfile.api
    image: emucraft-laser-api:latest
    container_name: laser-api
    restart: unless-stopped
    mem_limit: 4g
    cpus: 4
    expose:
      - "8001"
    environment:
      - LASER_TOKEN=${LASER_TOKEN:-}
      - LASER_SECRET=${LASER_SECRET:-}
    volumes:
      - laser-templates:/templates:ro   # renders templates by id; laser-mcp uploads them
    networks:
      - emucraft

  # Moonshot's MCP server: the moonshot image, run as its own service with its own data.
  moonshot-mcp:
    image: moonshot:latest
    container_name: moonshot-mcp
    restart: unless-stopped
    profiles: ["moonshot-mcp"]
    depends_on:
      - moonshot   # builds the image
    command: ["python", "-m", "moonshot.server", "--http", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    expose:
      - "8000"
    environment:
      - MOONSHOT_TOKEN=${MOONSHOT_TOKEN:-}
      - MOONSHOT_URL=${MOONSHOT_URL:-}
    volumes:
      - moonshot-mcp:/data
    networks:
      - emucraft

  # emucraft's MCP server: the emucraft image, run as its own service. Mount programs on /programs to check them
  # by `path`; otherwise callers pass G-code inline. Its detection settings (update_settings) are kept in /data.
  emucraft-mcp:
    image: emucraft:latest
    container_name: emucraft-mcp
    restart: unless-stopped
    profiles: ["emucraft-mcp"]
    depends_on:
      - emucraft   # builds the image
    command: ["python", "-m", "emucraft", "mcp", "--http", "--host", "0.0.0.0", "--port", "8000", "--programs", "/programs"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
    expose:
      - "8000"
    environment:
      - EMUCRAFT_TOKEN=${EMUCRAFT_TOKEN:-}
      - EMUCRAFT_MCP_CONFIG=/data/mcp.json
    volumes:
      - emucraft-mcp:/data
    #   - ./programs:/programs:ro
    networks:
      - emucraft

  # The laser MCP server (laser/mcp.mjs): the laser-api image, run as its own service. It shares LASER_SECRET with
  # laser-api, so a part gets the same stand-in size from both. Templates uploaded here are kept in laser-templates.
  laser-mcp:
    image: emucraft-laser-api:latest
    container_name: laser-mcp
    restart: unless-stopped
    profiles: ["laser-mcp"]
    depends_on:
      - laser-api   # builds the image
    command: ["node", "mcp.mjs"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health > /dev/null || exit 1"]
    mem_limit: 4g
    cpus: 4
    expose:
      - "8000"
    environment:
      - PORT=8000
      - LASER_TOKEN=${LASER_MCP_TOKEN:-}
      - LASER_SECRET=${LASER_SECRET:-}
    volumes:
      - laser-templates:/templates
    networks:
      - emucraft

volumes:
  moonshot-web:
  moonshot-mcp:
  emucraft-mcp:
  laser-templates:   # proprietary template parts: never bind-mount this into a served directory

networks:
  emucraft:
    external: true
    name: ${EMUCRAFT_NETWORK:-emucraft}
