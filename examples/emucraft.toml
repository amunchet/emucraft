# Example Emucraft configuration.
#
# `emucraft check part.nc` picks up an emucraft.toml next to the program (or
# in any folder above it). Every section is optional; values in the program's
# CAM header are used when this file does not say otherwise.

units = "inch"                 # units of the lengths in this file

[machine]
rapid_rate = 1200              # in/min, for cycle time estimates
rapid_mode = "linear"          # "dogleg" if rapids are not interpolated
tool_change_time = 8           # seconds
# table_z = -1.0               # lowest point the tip may reach (default: stock bottom)
# limits = { x = [-20, 20], y = [-10, 10], z = [-12, 2] }

[check]
# resolution = 0.002           # cell size; default picks ~6 million cells
link_feed = 700                # feed moves this fast are links and must not cut
# block_delete = true          # skip blocks that start with '/'

# Tool data the CAM post does not write. Program comments fill in the rest.
[tools.20]
flute_length = 1.0
holder_diameter = 1.3          # the post writes 10.0 as a placeholder

[default_tool]
holder_diameter = 1.5

[optimize]
material = "titanium"
# corner_angle = 40            # degrees of direction change that make a corner
# corner_factor = 0.5          # feed factor at sharp corners
# corner_zone = 1.0            # slow zone before/after a corner, in tool diameters
# load_limit = 1.2             # allowed removal rate relative to the nominal cut
