[build-system]
# Low floor on purpose: an old pip can then reach setup.py, which explains the
# Python requirement. Current pips install a current setuptools anyway.
requires = ["setuptools>=40.8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emucraft"
dynamic = ["version"]
description = "Fast G-code simulation, collision checking and feed optimization with a web (Three.js) viewer, and Moonshot: cylinder contact planning for robot sanding"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7"]
mcp = ["mcp>=2; python_version >= '3.10'"]
# Moonshot (Python 3.10+): the planner, its pictures, and its web page (moonshot-web)
moonshot = ["numpy>=1.24", "scipy>=1.14", "numba>=0.59", "trimesh>=4.0", "matplotlib>=3.7", "pillow>=10",
            "shapely>=2", "fast-simplification"]
step = ["cascadio"]
# Moonshot's MCP server, run on its own (moonshot-mcp)
moonshot-mcp = ["emucraft[moonshot]", "mcp>=2.3", "uvicorn"]
moonshot-dev = ["emucraft[moonshot-mcp]", "pytest>=7", "httpx", "rtree", "scikit-image>=0.22"]

[project.scripts]
emucraft = "emucraft.cli:main"
moonshot = "moonshot.pipeline:main"
moonshot-web = "moonshot.web:main"
moonshot-mcp = "moonshot.server:main"

[tool.setuptools]
packages = ["emucraft", "moonshot"]

[tool.setuptools.dynamic]
version = { attr = "emucraft.__version__" }

[tool.setuptools.package-data]
emucraft = ["web/*", "web/**/*", "_kernel/*"]
moonshot = ["page/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:skimage"]
