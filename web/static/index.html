<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emucraft</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #d8dce3; --accent: #2563eb; --danger: #c2410c; --ok: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #1a1f28; --text: #e6e8ec; --muted: #9aa3b2;
      --border: #2c3340; --accent: #60a5fa; --danger: #fb923c; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    display: grid; grid-template-columns: 320px 1fr; height: 100vh;
  }
  aside {
    background: var(--panel); border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px;
  }
  h1 { font-size: 18px; margin: 0; }
  h2 { font-size: 13px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  label { display: block; color: var(--muted); margin-bottom: 4px; }
  input[type=file], select { width: 100%; }
  select, button {
    font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; width: 100%; }
  button.primary:disabled { opacity: .6; cursor: progress; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .status { min-height: 1.4em; }
  .status.error { color: var(--danger); }
  .verdict { padding: 8px 10px; border-radius: 6px; border: 1px solid currentColor; font-weight: 600; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--danger); }
  ul.cuts { margin: 6px 0 0; padding-left: 18px; max-height: 200px; overflow-y: auto; font-variant-numeric: tabular-nums; }
  .toggles label { display: flex; gap: 6px; align-items: center; color: var(--text); margin: 0; }
  main { position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
  .legend { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 3px; margin-right: 5px; vertical-align: middle; background: var(--c); }
  @media (max-width: 760px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    main { height: 60vh; }
  }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<aside>
  <h1>Emucraft</h1>
  <form id="form">
    <label for="file">G-code program</label>
    <input id="file" name="file" type="file" required>
    <div style="height:10px"></div>
    <label for="resolution">Grid resolution</label>
    <select id="resolution">
      <option value="2">0.002 (fine, slow)</option>
      <option value="5" selected>0.005</option>
      <option value="10">0.010</option>
      <option value="20">0.020 (coarse, fast)</option>
    </select>
    <div style="height:12px"></div>
    <button class="primary" id="run" type="submit">Simulate</button>
  </form>
  <div class="status" id="status"></div>
  <section id="results" hidden>
    <div class="verdict" id="verdict"></div>
    <div style="height:12px"></div>
    <h2>Summary</h2>
    <dl id="summary"></dl>
    <div id="cuts-section" hidden>
      <div style="height:12px"></div>
      <h2>Non-cutting moves that removed material</h2>
      <ul class="cuts" id="cuts"></ul>
    </div>
    <div style="height:12px"></div>
    <h2>Display</h2>
    <div class="toggles">
      <label><input type="checkbox" id="show-path" checked> Toolpath</label>
      <label><input type="checkbox" id="show-rapid"> Rapid / spindle-off moves</label>
    </div>
  </section>
</aside>
<main>
  <div id="view"></div>
  <div class="empty" id="empty">Upload a G-code program to simulate the stock.</div>
  <div class="legend">
    <span style="--c:#2563eb">Cutting</span>
    <span style="--c:#ef4444">Rapid</span>
  </div>
</main>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const view = $("view");

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 1000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(1, -1, 2);
scene.add(sun);

const dark = matchMedia("(prefers-color-scheme: dark)");
const applyTheme = () => scene.background = new THREE.Color(dark.matches ? 0x11141a : 0xf6f7f9);
dark.addEventListener("change", applyTheme);
applyTheme();

let group = null, cutPath = null, rapidPath = null;

function resize() {
  const { clientWidth: w, clientHeight: h } = view;
  renderer.setSize(w, h);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

function buildStock(data) {
  const hm = data.heightmap;
  const [x0] = data.block.x, [y0] = data.block.y;
  const [zMin, zMax] = data.block.z;
  const nx = hm.nx, ny = hm.ny;
  const pos = new Float32Array(nx * ny * 3);
  const col = new Float32Array(nx * ny * 3);
  const low = new THREE.Color(0x1e3a8a), high = new THREE.Color(0xcbd5e1), c = new THREE.Color();
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < ny; j++) {
      const k = i * ny + j, z = hm.z[k];
      pos.set([x0 + (i + 0.5) * hm.cell_x, y0 + (j + 0.5) * hm.cell_y, z], k * 3);
      const t = zMax > zMin ? (z - zMin) / (zMax - zMin) : 1;
      c.copy(low).lerp(high, Math.min(Math.max(t, 0), 1));
      col.set([c.r, c.g, c.b], k * 3);
    }
  }
  const idx = [];
  for (let i = 0; i < nx - 1; i++) {
    for (let j = 0; j < ny - 1; j++) {
      const a = i * ny + j, b = a + 1, d = a + ny, e = d + 1;
      idx.push(a, d, e, a, e, b);
    }
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geom.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geom.setIndex(idx);
  geom.computeVertexNormals();
  return new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.8, side: THREE.DoubleSide }));
}

function buildPath(points, cutting, color) {
  // Break the polyline wherever the move type changes so segments don't bridge gaps
  const verts = [];
  for (let i = 1; i < points.length; i++) {
    const a = points[i - 1], b = points[i];
    if (a[3] === cutting && b[3] === cutting) verts.push(a[0], a[1], a[2], b[0], b[1], b[2]);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  return new THREE.LineSegments(geom, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8 }));
}

function show(data) {
  if (group) {
    scene.remove(group);
    group.traverse((o) => { o.geometry?.dispose(); o.material?.dispose(); });
  }
  group = new THREE.Group();
  group.add(buildStock(data));
  cutPath = buildPath(data.toolpath, 1, 0x2563eb);
  rapidPath = buildPath(data.toolpath, 0, 0xef4444);
  cutPath.visible = $("show-path").checked;
  rapidPath.visible = $("show-rapid").checked;
  group.add(cutPath, rapidPath);
  scene.add(group);

  const [x0, x1] = data.block.x, [y0, y1] = data.block.y, [z0, z1] = data.block.z;
  const center = new THREE.Vector3((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  const size = Math.max(x1 - x0, y1 - y0, z1 - z0, 0.1);
  controls.target.copy(center);
  camera.position.set(center.x - size, center.y - 1.4 * size, center.z + 1.2 * size);
  camera.near = size / 1000; camera.far = size * 100;
  camera.updateProjectionMatrix();
  $("empty").hidden = true;

  const s = data.stats, fmt = (v, d = 4) => Number(v).toFixed(d);
  const rows = [
    ["Stock X", `${fmt(x0)} → ${fmt(x1)}`],
    ["Stock Y", `${fmt(y0)} → ${fmt(y1)}`],
    ["Stock Z", `${fmt(z0)} → ${fmt(z1)}`],
    ["Stock from", data.block.from_header ? "program header" : "toolpath extents"],
    ["Tool Ø", fmt(data.tool.diameter)],
    ["Grid", `${data.grid.nx} × ${data.grid.ny} @ ${data.grid.cell_size}`],
    ["Points", s.points.toLocaleString()],
    ["Material removed", fmt(s.removed_volume)],
  ];
  $("summary").replaceChildren(...rows.flatMap(([k, v]) => {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    return [dt, dd];
  }));

  const verdict = $("verdict");
  if (s.rapid_cut_count > 0) {
    verdict.className = "verdict bad";
    verdict.textContent = `${s.rapid_cut_count.toLocaleString()} non-cutting move(s) removed material`;
  } else {
    verdict.className = "verdict ok";
    verdict.textContent = "No rapid or spindle-off moves into stock";
  }
  $("cuts-section").hidden = data.rapid_cuts.length === 0;
  $("cuts").replaceChildren(...data.rapid_cuts.map((r) => {
    const li = document.createElement("li");
    li.textContent = `#${r.point}: X${r.x} Y${r.y} Z${r.z}`;
    return li;
  }));
  $("results").hidden = false;
}

$("show-path").addEventListener("change", (e) => { if (cutPath) cutPath.visible = e.target.checked; });
$("show-rapid").addEventListener("change", (e) => { if (rapidPath) rapidPath.visible = e.target.checked; });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const file = $("file").files[0];
  if (!file) return;
  const status = $("status"), btn = $("run");
  status.className = "status";
  status.textContent = `Simulating ${file.name}…`;
  btn.disabled = true;
  const started = performance.now();
  try {
    const body = new FormData();
    body.append("file", file);
    const res = await fetch(`api/simulate?resolution=${$("resolution").value}`, { method: "POST", body });
    const data = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    show(data);
    status.textContent = `${file.name} — ${((performance.now() - started) / 1000).toFixed(1)}s`;
  } catch (err) {
    status.className = "status error";
    status.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
